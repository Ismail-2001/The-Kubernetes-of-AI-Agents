{{- if .Values.ingress.enabled }}
# ─── Security Headers ────────────────────────────────────────────────────────
# Applied to all responses via NGINX ingress add-headers directive.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "e-gaop.fullname" . }}-security-headers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: security-headers
data:
  # Prevent MIME type sniffing
  X-Content-Type-Options: "nosniff"
  # Clickjacking protection
  X-Frame-Options: "DENY"
  # XSS filter (legacy browsers)
  X-XSS-Protection: "1; mode=block"
  # Referrer policy — send origin only on cross-origin requests
  Referrer-Policy: "strict-origin-when-cross-origin"
  # Permissions policy — restrict browser features
  Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
  # Content Security Policy — restrict resource loading
  Content-Security-Policy: >-
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: https:;
    font-src 'self' data:;
    connect-src 'self' wss: https:;
    frame-ancestors 'none';
    base-uri 'self';
    form-action 'self'
  # Strict Transport Security (reinforce NGINX hsts setting)
  Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
{{- end }}
