{{- if .Values.externalSecrets.enabled }}
# ─── ESO ClusterSecretStore (Kubernetes provider) ────────────────────────────
# For Kind/dev: reads from a source Secret in the external-secrets namespace.
# For production: swap to aws/gcp/vault provider.
#
# Architecture:
#   Source Secret (external-secrets ns) → ESO → Managed Secret (egaop ns) → Pods
#
# The ServiceAccount referenced below must have RBAC to read secrets from the
# source namespace. RBAC is defined in rbac-eso.yaml.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "e-gaop.fullname" . }}-kubernetes
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
spec:
  provider:
    kubernetes:
      # In-cluster: defaults to https://kubernetes.default.svc
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: kube-public
          key: ca.crt
      # Remote namespace where source secrets live
      remoteNamespace: {{ .Values.externalSecrets.sourceNamespace | default "external-secrets" }}
      # Auth: use the ServiceAccount token (auto-mounted)
      auth:
        serviceAccount:
          name: {{ include "e-gaop.fullname" . }}-eso-store
          namespace: {{ .Release.Namespace }}
---
# ─── ExternalSecret: sync source → managed secret ────────────────────────────
# ESO reconciles this every refreshInterval and updates the target Secret.
# The target Secret name matches the existing managed-secrets name so that
# all existing `existingSecret` references in postgresql/redis/subcharts work.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "e-gaop.fullname" . }}-managed-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
  annotations:
    "helm.sh/resource-policy": keep
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | default "1m" }}
  secretStoreRef:
    name: {{ include "e-gaop.fullname" . }}-kubernetes
    kind: ClusterSecretStore
  target:
    name: {{ include "e-gaop.fullname" . }}-managed-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: encryption-key
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: encryption-key
    - secretKey: jwt-secret
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: jwt-secret
    - secretKey: database-url
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: database-url
    - secretKey: postgres-password
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: postgres-password
    - secretKey: redis-password
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: redis-password
    - secretKey: openai-api-key
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: openai-api-key
    - secretKey: grafana-password
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: grafana-password
    - secretKey: internal-service-token
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: internal-service-token
    - secretKey: temporal-tls-cert
      remoteRef:
        key: {{ .Values.externalSecrets.sourceSecretName | default "egaop-source-secrets" }}
        property: temporal-tls-cert
{{- end }}
