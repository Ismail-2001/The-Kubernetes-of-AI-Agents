{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backup-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  backup.sh: |
    #!/bin/sh
    set -eu
    export PGPASSWORD="$POSTGRES_PASSWORD"
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    BACKUP_DIR="/backups"
    BACKUP_FILE="$BACKUP_DIR/postgres-${TIMESTAMP}.dump"
    BACKUP_GZ="${BACKUP_FILE}.gz"
    LOG_PREFIX="[backup ${TIMESTAMP}]"

    echo "$LOG_PREFIX Starting PostgreSQL backup"
    echo "$LOG_PREFIX Host: ${POSTGRES_HOST}:${POSTGRES_PORT}"
    echo "$LOG_PREFIX Database: ${POSTGRES_DB}"

    mkdir -p "$BACKUP_DIR"

    echo "$LOG_PREFIX Running pg_dump..."
    pg_dump \
      -h "$POSTGRES_HOST" \
      -p "$POSTGRES_PORT" \
      -U "$POSTGRES_USER" \
      -d "$POSTGRES_DB" \
      --format=custom \
      --compress=0 \
      -f "$BACKUP_FILE"

    DUMP_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || stat -f%z "$BACKUP_FILE" 2>/dev/null || echo "unknown")
    echo "$LOG_PREFIX pg_dump complete: $BACKUP_FILE ($DUMP_SIZE bytes)"

    echo "$LOG_PREFIX Verifying dump archive..."
    pg_restore --list "$BACKUP_FILE" >/dev/null
    echo "$LOG_PREFIX Dump archive verified (pg_restore --list OK)"

    echo "$LOG_PREFIX Compressing backup..."
    gzip -9 "$BACKUP_FILE"
    COMPRESSED_SIZE=$(stat -c%s "$BACKUP_GZ" 2>/dev/null || stat -f%z "$BACKUP_GZ" 2>/dev/null || echo "unknown")
    gzip -t "$BACKUP_GZ"
    echo "$LOG_PREFIX Compressed: $BACKUP_GZ ($COMPRESSED_SIZE bytes) gzip OK"

    {{- if .Values.backup.s3.enabled }}
    echo "$LOG_PREFIX Uploading to S3: s3://{{ .Values.backup.s3.bucket }}/postgres/"
    aws s3 cp "$BACKUP_GZ" "s3://{{ .Values.backup.s3.bucket }}/postgres/$(basename $BACKUP_GZ)" \
      --region "{{ .Values.backup.s3.region }}" \
      --storage-class STANDARD_IA
    echo "$LOG_PREFIX S3 upload complete"
    {{- end }}

    echo "$LOG_PREFIX Pruning backups older than {{ .Values.backup.retentionDays }} days..."
    find "$BACKUP_DIR" -name "postgres-*.dump.gz" -mtime +{{ .Values.backup.retentionDays }} -delete 2>/dev/null || true
    PRUNED=$(find "$BACKUP_DIR" -name "postgres-*.dump.gz" | wc -l)
    echo "$LOG_PREFIX Retained backups: $PRUNED"

    {{- if .Values.backup.s3.enabled }}
    echo "$LOG_PREFIX Pruning S3 backups older than {{ .Values.backup.retentionDays }} days..."
    CUTOFF=$(date -d "-{{ .Values.backup.retentionDays }} days" +%Y-%m-%d 2>/dev/null || date -v-${{ .Values.backup.retentionDays }}d +%Y-%m-%d 2>/dev/null || echo "")
    if [ -n "$CUTOFF" ]; then
      aws s3 ls "s3://{{ .Values.backup.s3.bucket }}/postgres/" --region "{{ .Values.backup.s3.region }}" | \
        awk '$4 ~ /^postgres-.*\.dump\.gz$/ && $1 < "'"$CUTOFF"'" {print $4}' | \
        while read f; do
          echo "$LOG_PREFIX Deleting old S3 backup: $f"
          aws s3 rm "s3://{{ .Values.backup.s3.bucket }}/postgres/$f" --region "{{ .Values.backup.s3.region }}"
        done
    fi
    {{- end }}

    echo "$LOG_PREFIX Backup complete successfully"

  restore.sh: |
    #!/bin/sh
    set -eu
    export PGPASSWORD="$POSTGRES_PASSWORD"
    RESTORE_DIR="/backups"
    LOG_PREFIX="[restore]"

    if [ -n "${BACKUP_FILE:-}" ]; then
      RESTORE_FILE="$BACKUP_FILE"
    else
      echo "$LOG_PREFIX No BACKUP_FILE specified, finding latest local backup..."
      RESTORE_FILE=$(ls -t "$RESTORE_DIR"/postgres-*.dump.gz 2>/dev/null | head -1)
      if [ -z "$RESTORE_FILE" ]; then
        echo "$LOG_PREFIX ERROR: No backup files found in $RESTORE_DIR"
        exit 1
      fi
    fi

    echo "$LOG_PREFIX Restoring from: $RESTORE_FILE"
    echo "$LOG_PREFIX Target: ${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}"

    if echo "$RESTORE_FILE" | grep -q '\.gz$'; then
      echo "$LOG_PREFIX Decompressing..."
      gunzip -c "$RESTORE_FILE" > /tmp/restore.dump
      RESTORE_FILE="/tmp/restore.dump"
    fi

    echo "$LOG_PREFIX Dropping and recreating database..."
    psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/postgres" \
      -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '$POSTGRES_DB' AND pid <> pg_backend_pid();" \
      -c "DROP DATABASE IF EXISTS $POSTGRES_DB;" \
      -c "CREATE DATABASE $POSTGRES_DB;"

    echo "$LOG_PREFIX Restoring database..."
    pg_restore \
      -h "$POSTGRES_HOST" \
      -p "$POSTGRES_PORT" \
      -U "$POSTGRES_USER" \
      -d "$POSTGRES_DB" \
      --no-owner \
      --no-privileges \
      "$RESTORE_FILE"

    echo "$LOG_PREFIX Verifying restore..."
    TABLE_COUNT=$(psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" \
      -t -c "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';" | tr -d ' ')
    echo "$LOG_PREFIX Restored tables: $TABLE_COUNT"

    echo "$LOG_PREFIX Restore complete successfully"
{{- end }}
