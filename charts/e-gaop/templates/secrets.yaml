{{- /*
  Managed secrets fallback.
  When externalSecrets.enabled is false (no Vault/ESO available, e.g. local kind),
  render a Secret directly with auto-generated random values.

  WARNING: Auto-generated secrets change on every `helm upgrade`, which will
  invalidate existing sessions, encrypted data, and database connections.
  For stable deployments, set explicit values or enable externalSecrets.
*/}}
{{- if not .Values.externalSecrets.enabled }}
{{- $encKey := (.Values.secrets.encryptionKey | default (randAlphaNum 64)) }}
{{- $jwtSecret := (.Values.secrets.jwtSecret | default (randAlphaNum 64)) }}
{{- $dbUrl := (.Values.secrets.databaseUrl | default (printf "postgres://egaop:%s@egaop-postgresql:5432/egaop" (randAlphaNum 24))) }}
{{- $redisPw := (.Values.secrets.redisPassword | default (randAlphaNum 32)) }}
{{- $temporalCert := (.Values.secrets.temporalTlsCert | default "") }}
{{- $openaiKey := (.Values.secrets.openaiApiKey | default (printf "sk-dev-%s" (randAlphaNum 48))) }}
{{- $grafanaPw := (.Values.secrets.grafanaPassword | default (randAlphaNum 32)) }}
{{- $internalToken := (.Values.secrets.internalServiceToken | default (randAlphaNum 48)) }}
{{- $postgresPw := (.Values.secrets.postgresPassword | default .Values.postgresql.auth.password | default (randAlphaNum 24)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "e-gaop.fullname" . }}-managed-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  encryption-key: {{ $encKey | quote }}
  jwt-secret: {{ $jwtSecret | quote }}
  database-url: {{ $dbUrl | quote }}
  postgres-password: {{ $postgresPw | quote }}
  redis-password: {{ $redisPw | quote }}
  temporal-tls-cert: {{ $temporalCert | quote }}
  openai-api-key: {{ $openaiKey | quote }}
  grafana-password: {{ $grafanaPw | quote }}
  internal-service-token: {{ $internalToken | quote }}
{{- end }}
