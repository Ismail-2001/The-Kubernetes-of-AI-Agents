{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    metadata:
      labels:
        {{- include "e-gaop.labels" . | nindent 8 }}
        app.kubernetes.io/component: backup
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/part-of: e-gaop
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            fsGroup: 999
          initContainers:
            - name: wait-for-postgres
              image: "{{ .Values.postgresql.image.registry | default "docker.io" }}/{{ .Values.postgresql.image.repository | default "bitnami/postgresql" }}:{{ .Values.postgresql.image.tag | default "16" }}"
              command:
                - /bin/sh
                - -c
                - |
                  echo "Waiting for PostgreSQL to be ready..."
                  for i in $(seq 1 30); do
                    PGPASSWORD="$POSTGRES_PASSWORD" psql -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" >/dev/null 2>&1 && exit 0
                    echo "Attempt $i/30 - PostgreSQL not ready, waiting 2s..."
                    sleep 2
                  done
                  echo "ERROR: PostgreSQL not ready after 60s"
                  exit 1
              env:
                - name: POSTGRES_HOST
                  value: "{{ .Release.Name }}-postgresql"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" .Release.Name) }}
                      key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
          containers:
            - name: backup
              image: "{{ .Values.postgresql.image.registry | default "docker.io" }}/{{ .Values.postgresql.image.repository | default "bitnami/postgresql" }}:{{ .Values.postgresql.image.tag | default "16" }}"
              command:
                - /bin/sh
                - -c
                - |
                  /scripts/backup.sh
              env:
                - name: POSTGRES_HOST
                  value: "{{ .Release.Name }}-postgresql"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: POSTGRES_USER
                  value: {{ .Values.postgresql.auth.username | default "postgres" | quote }}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" .Release.Name) }}
                      key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
              {{- if .Values.backup.s3.enabled }}
              - name: AWS_ACCESS_KEY_ID
                valueFrom:
                  secretKeyRef:
                    name: {{ .Release.Name }}-backup-s3-credentials
                    key: aws-access-key-id
                    optional: true
              - name: AWS_SECRET_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: {{ .Release.Name }}-backup-s3-credentials
                    key: aws-secret-access-key
                    optional: true
              {{- end }}
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: {{ .Values.backup.resources.requests.cpu | default "100m" }}
                  memory: {{ .Values.backup.resources.requests.memory | default "128Mi" }}
                limits:
                  memory: {{ .Values.backup.resources.limits.memory | default "256Mi" }}
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
          volumes:
            - name: backup-scripts
              configMap:
                name: {{ .Release.Name }}-backup-scripts
                defaultMode: 0755
            - name: backups
              {{- if .Values.backup.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}-backup-pvc
              {{- else }}
              emptyDir:
                sizeLimit: {{ .Values.backup.persistence.emptyDirSize | default "2Gi" }}
              {{- end }}
---
{{- if .Values.backup.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup-pvc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.backup.persistence.storageClass }}
  storageClassName: {{ .Values.backup.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.persistence.size | default "5Gi" }}
{{- end }}
{{- end }}
