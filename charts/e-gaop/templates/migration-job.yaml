{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "e-gaop.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: e-gaop
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: migrate
          image: "{{ .Values.migration.image | default "postgres" }}:{{ .Values.migration.tag | default "16" }}"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "=== E-GAOP Database Migration ==="
              echo "Host: $POSTGRES_HOST"
              echo "Database: $POSTGRES_DB"
              echo ""
              echo "Waiting for PostgreSQL..."
              for i in $(seq 1 60); do
                if pg_isready -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" -U "$POSTGRES_USER" >/dev/null 2>&1; then
                  echo "PostgreSQL is ready."
                  break
                fi
                echo "  attempt $i/60 - not ready yet..."
                sleep 2
              done
              for f in /migrations/*.sql; do
                echo "--- Applying: $(basename $f) ---"
                psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB?sslmode=prefer" \
                  -f "$f" --set ON_ERROR_STOP=1 -v ON_ERROR_STOP=1
                echo "--- Done: $(basename $f) ---"
                echo ""
              done
              echo "=== All migrations applied successfully ==="
          env:
            - name: POSTGRES_HOST
              value: "{{ .Release.Name }}-postgresql"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret | default (printf "%s-postgresql" .Release.Name) }}
                  key: {{ .Values.postgresql.auth.secretKeys.userPasswordKey | default "password" }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ .Release.Name }}-migrations
{{- end }}
