# values-kind.yml — Minimal Kind-specific overrides for E-GAOP
# Absolute minimum resource usage to avoid Docker Desktop overload

global:
  imageRegistry: ""
  imagePullSecrets: []
  serviceMonitorEnabled: false
  otelEndpoint: ""

tls:
  certManager:
    enabled: true

certManager:
  enabled: true

serviceAccount:
  create: true

externalSecrets:
  enabled: true
  # Kubernetes provider: reads from source secret in this namespace
  sourceNamespace: external-secrets
  sourceSecretName: egaop-source-secrets
  # ESO refresh interval (how often it re-syncs from source)
  refreshInterval: 1m

vault:
  enabled: false

# Secrets are now managed by ESO (ExternalSecret CRD).
# Source of truth: kubectl get secret egaop-source-secrets -n external-secrets
# ESO syncs source → egaop-e-gaop-managed-secrets → pods
secrets: {}

ingress:
  enabled: true
  className: nginx
  certManagerIssuer: ""
  certManagerEmail: ""
  adminHost: admin.egaop.local
  apiHost: api.egaop.local
  grpcHost: grpc.egaop.local

postgresql:
  enabled: true
  image:
    tag: latest
  metrics:
    enabled: false
  primary:
    persistence:
      enabled: true
      size: 1Gi
  auth:
    username: egaop
    password: egaop-kind-test-postgres-24ch!
    database: egaop
    existingSecret: "egaop-e-gaop-managed-secrets"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgres-password

redis:
  enabled: true
  image:
    tag: latest
  metrics:
    enabled: false
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "egaop-e-gaop-managed-secrets"
    existingPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

temporal:
  enabled: true
  server:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config:
      persistence:
        defaultStore: default
        default:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "egaop-postgresql"
            port: 5432
            database: "temporal"
            user: "egaop"
            existingSecret: "egaop-e-gaop-managed-secrets"
            secretKey: "postgres-password"
            maxConns: 20
            maxConnLifetime: "1h"
        visibility:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "egaop-postgresql"
            port: 5432
            database: "temporal_visibility"
            user: "egaop"
            existingSecret: "egaop-e-gaop-managed-secrets"
            secretKey: "postgres-password"
            maxConns: 20
            maxConnLifetime: "1h"
  postgresql:
    enabled: false
  mysql:
    enabled: false
  # Temporal subchart overrides for Kind (resource-constrained)
  # Cassandra abandoned (mmap OOM); ES exhausts Kind. Use external Bitnami PostgreSQL.
  elasticsearch:
    enabled: false
  cassandra:
    enabled: false
  schema:
    createDatabase:
      # temporal / temporal_visibility already pre-created on egaop-postgresql
      enabled: false
    setup:
      enabled: true
    update:
      enabled: true
  # Keep Temporal's Prometheus/Grafana (they serve our 42 alert rules + dashboards)
  prometheus:
    enabled: true
    server:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
  grafana:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

opa:
  enabled: true
  replicas: 1
  hpa:
    enabled: false

otelCollector:
  enabled: false

migration:
  enabled: true

# Phase 4 — Kind-sized quotas (headroom above current ~18.5 CPU limits used)
# Phase 5: raised limits.cpu 24→32 for Loki+Promtail+Grafana headroom
# Phase 6: raised limits.cpu 32→40 for Tempo + rolling-restart headroom
resourceQuota:
  enabled: true
  requests:
    cpu: "8"
    memory: 10Gi
  limits:
    cpu: "40"
    memory: 24Gi
  pods: "100"
  services: "50"
  persistentvolumeclaims: "20"
  secrets: "80"
  configmaps: "80"
  containerDefaults:
    cpu: 500m
    memory: 512Mi
    requestCpu: 50m
    requestMemory: 64Mi
  containerMax:
    cpu: "4"
    memory: 3Gi
  containerMin:
    cpu: 10m
    memory: 16Mi
  podMax:
    cpu: "6"
    memory: 6Gi

# Phase 5 — Log aggregation (Kind-sized)
loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "3.0.0"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "3.0.0"
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    limits:
      cpu: 100m
      memory: 96Mi

# Phase 6 — Tempo distributed tracing (Kind-sized)
tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.6.1"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

api-server:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

workflow-engine:
  replicas: 1
  tls:
    certManager:
      enabled: true
  # Phase 7: request 128Mi → 192Mi so memory HPA (80%) no longer pegs at max
  # (steady-state usage ~125Mi = 98% of 128Mi request → 65% of 192Mi)
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

llm-router:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

secret-store:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

tool-proxy:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

sandbox-runtime:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

memory-plane:
  enabled: false

observability-plane:
  enabled: false

admin-console:
  replicas: 1
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# ─── Backup (Kind) ──────────────────────────────────────────────────────────
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 7
  s3:
    enabled: false
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
