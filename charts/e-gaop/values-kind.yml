# values-kind.yml — Minimal Kind-specific overrides for E-GAOP
# Absolute minimum resource usage to avoid Docker Desktop overload

global:
  imageRegistry: ""
  imagePullSecrets: []
  serviceMonitorEnabled: false
  otelEndpoint: "http://egaop-e-gaop-tempo:4318"

tls:
  certManager:
    enabled: true

certManager:
  enabled: true

serviceAccount:
  create: true

externalSecrets:
  enabled: true
  # Kubernetes provider: reads from source secret in this namespace
  sourceNamespace: external-secrets
  sourceSecretName: egaop-source-secrets
  # ESO refresh interval (how often it re-syncs from source)
  refreshInterval: 1m

vault:
  enabled: false

# Secrets are now managed by ESO (ExternalSecret CRD).
# Source of truth: kubectl get secret egaop-source-secrets -n external-secrets
# ESO syncs source → egaop-e-gaop-managed-secrets → pods
secrets: {}

ingress:
  enabled: true
  className: nginx
  certManagerIssuer: ""
  certManagerEmail: ""
  adminHost: admin.egaop.local
  apiHost: api.egaop.local
  grpcHost: grpc.egaop.local

postgresql:
  enabled: true
  image:
    tag: latest
  metrics:
    enabled: false
  primary:
    persistence:
      enabled: true
      size: 1Gi
  auth:
    username: egaop
    password: egaop-kind-test-postgres-24ch!
    database: egaop
    existingSecret: "egaop-e-gaop-managed-secrets"
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: postgres-password

redis:
  enabled: true
  image:
    tag: latest
  metrics:
    enabled: false
  architecture: standalone
  auth:
    enabled: true
    existingSecret: "egaop-e-gaop-managed-secrets"
    existingPasswordKey: redis-password
  master:
    persistence:
      enabled: true
      size: 1Gi
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

temporal:
  enabled: true
  server:
    replicaCount: 1
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Phase 8 — PSA restricted: pod-level runAsNonRoot + seccomp for all
    # temporal server deployments (frontend/history/matching/worker)
    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    frontend:
      containerSecurityContext: &temporalContainerSC
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    history:
      containerSecurityContext: *temporalContainerSC
    matching:
      containerSecurityContext: *temporalContainerSC
    worker:
      containerSecurityContext: *temporalContainerSC
    config:
      persistence:
        defaultStore: default
        default:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "egaop-postgresql"
            port: 5432
            database: "temporal"
            user: "egaop"
            existingSecret: "egaop-e-gaop-managed-secrets"
            secretKey: "postgres-password"
            maxConns: 20
            maxConnLifetime: "1h"
        visibility:
          driver: "sql"
          sql:
            driver: "postgres12"
            host: "egaop-postgresql"
            port: 5432
            database: "temporal_visibility"
            user: "egaop"
            existingSecret: "egaop-e-gaop-managed-secrets"
            secretKey: "postgres-password"
            maxConns: 20
            maxConnLifetime: "1h"
  # Phase 8 — PSA restricted: temporal UI image (temporalio/ui) runs as root
  # by default but ships a `temporal` user (uid 5000) owning /home/ui-server —
  # it must run as that uid or ./config/docker.yaml creation fails (EACCES).
  # Listens on 8080, so no capabilities needed.
  web:
    securityContext:
      runAsUser: 5000
      runAsGroup: 5000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext: *temporalContainerSC
  admintools:
    securityContext: &temporalToolSC
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext: *temporalContainerSC
  postgresql:
    enabled: false
  mysql:
    enabled: false
  # Temporal subchart overrides for Kind (resource-constrained)
  # Cassandra abandoned (mmap OOM); ES exhausts Kind. Use external Bitnami PostgreSQL.
  elasticsearch:
    enabled: false
  cassandra:
    enabled: false
  schema:
    # Phase 8 — PSA restricted: schema job pods (admin-tools image, root default)
    securityContext: *temporalToolSC
    containerSecurityContext: *temporalContainerSC
    createDatabase:
      # temporal / temporal_visibility already pre-created on egaop-postgresql
      enabled: false
    setup:
      enabled: true
    update:
      enabled: true
  # Keep Temporal's Prometheus/Grafana (they serve our 42 alert rules + dashboards)
  prometheus:
    enabled: true
    server:
      resources:
        requests:
          cpu: 50m
          memory: 192Mi
        limits:
          memory: 512Mi
      # Phase 6: Tempo OTLP remote_write lands here (was added via live patch)
      extraArgs:
        web.enable-remote-write-receiver: null
      # Phase 8 — PSA restricted
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext: &promContainerSC
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
    serverFiles:
      alerting_rules.yml:
        # E-GAOP alerting rules — plain Prometheus rule-file format.
        #
        # Live target: ConfigMap `egaop-prometheus-server` (namespace egaop), key
        # `alerting_rules.yml` (already listed in prometheus.yml `rule_files`).
        # The observability-plane PrometheusRule CR stays disabled
        # (prometheusRules.enabled=false — no prometheus-operator CRDs installed),
        # so this file is the operative source of truth. A configmap-reloader sidecar
        # watches /etc/config and POSTs /-/reload on change (no pod restart needed).
        #
        # All expressions below were validated against live series:
        #   kube_*/container_* (kube-state-metrics, cadvisor), temporal_* (native
        #   :9090), prometheus_* (self-monitoring), up (all jobs).
        # egaop.slo.rules depends on OTel http_server_duration_* metrics that appear
        # only once the OTel collector pipeline is deployed; the group is inert until
        # then and activates automatically when those series exist.
        groups:
          - name: egaop.availability.rules
            rules:
              - alert: EgaopTargetDown
                expr: up == 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Scrape target down: {{ $labels.job }}/{{ $labels.instance }}"
                  description: >-
                    Prometheus has failed to scrape {{ $labels.instance }}
                    (job={{ $labels.job }}, pod={{ $labels.pod }}) for 5 minutes.
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopPrometheusAlertmanagerMissing
                expr: prometheus_notifications_alertmanagers_discovered < 1
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Prometheus has no Alertmanager targets"
                  description: >-
                    Prometheus discovered fewer than one Alertmanager — alerts are
                    being evaluated but nowhere delivered. Check the
                    egaop-alertmanager StatefulSet and the alerting section of
                    prometheus.yml.
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopPrometheusConfigReloadFailed
                expr: prometheus_config_last_reload_successful == 0
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Prometheus config reload failed"
                  description: >-
                    The last Prometheus configuration/rule reload failed; the running
                    config is stale. Check the configmap-reloader logs and the
                    prometheus server log for the parse error.
                  runbook: "docs/runbooks/service-down.md"

          - name: egaop.infrastructure.rules
            rules:
              - alert: EgaopPodOOMKilled
                expr: kube_pod_container_status_last_terminated_reason{namespace="egaop",reason="OOMKilled"} > 0
                for: 0m
                labels:
                  severity: critical
                annotations:
                  summary: "Pod OOMKilled: {{ $labels.pod }}"
                  description: >-
                    Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} was
                    terminated due to OOM. Increase memory limits or investigate a
                    memory leak.
                  runbook: "docs/runbooks/scaling.md"

              - alert: EgaopPodCrashLooping
                expr: rate(kube_pod_container_status_restarts_total{namespace="egaop"}[15m]) * 60 * 5 > 0
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Pod crash looping: {{ $labels.pod }}"
                  description: >-
                    Pod {{ $labels.pod }} has restarted
                    {{ $value | printf "%.0f" }} times in the last 15 minutes.
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopHighCPUThrottling
                expr: |
                  (
                    sum(rate(container_cpu_cfs_throttled_periods_total{namespace="egaop",container!=""}[5m])) by (pod, container)
                    /
                    sum(rate(container_cpu_cfs_periods_total{namespace="egaop",container!=""}[5m])) by (pod, container)
                  ) > 0.5
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "High CPU throttling: {{ $labels.pod }}/{{ $labels.container }}"
                  description: >-
                    Container {{ $labels.container }} in pod {{ $labels.pod }} is being
                    CPU-throttled {{ $value | humanizePercentage }} of the time.
                    Increase CPU limits.
                  runbook: "docs/runbooks/scaling.md"

              - alert: EgaopHighMemoryUsage
                expr: |
                  (
                    container_memory_working_set_bytes{namespace="egaop",container!=""}
                    /
                    kube_pod_container_resource_limits{namespace="egaop",resource="memory",container!=""}
                  ) > 0.9
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "High memory usage: {{ $labels.pod }}/{{ $labels.container }}"
                  description: >-
                    Container {{ $labels.container }} in pod {{ $labels.pod }} is using
                    {{ $value | humanizePercentage }} of its memory limit.
                  runbook: "docs/runbooks/scaling.md"

          - name: egaop.temporal.rules
            rules:
              - alert: EgaopTemporalHighFailureRate
                expr: |
                  (
                    sum(rate(temporal_request_failure[5m]))
                    /
                    clamp_min(sum(rate(temporal_request[5m])), 0.001)
                  ) > 0.05
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Temporal request failure rate above 5%"
                  description: >-
                    More than 5% of Temporal requests are failing over the last
                    5 minutes (current: {{ $value | humanizePercentage }}).
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopTemporalNoPollers
                expr: sum(temporal_num_pollers) == 0
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "No Temporal pollers registered"
                  description: >-
                    No workflow/activity pollers have been registered for 10 minutes —
                    task queues are not being drained. Check the temporal-worker
                    deployment.
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopTemporalLongRequestFailures
                expr: sum(rate(temporal_long_request_failure[10m])) > 0.1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Sustained Temporal long-request failures"
                  description: >-
                    Temporal is recording long-request failures for 5+ minutes
                    ({{ $value | printf "%.2f" }}/s) — often a sign of history service
                    pressure or clock/timeout issues.
                  runbook: "docs/runbooks/service-down.md"

          # Burn-rate SLO alerts (Google SRE Workbook, multi-window).
          # Inert until OTel http_server_duration_* series exist (OTel collector
          # pipeline); no expression changes needed when it lands.
          - name: egaop.slo.rules
            rules:
              - alert: EgaopSLOBurnRateHigh
                expr: |
                  (
                    sum(rate(http_server_duration_count{http_status_code=~"5..",app_kubernetes_io_part_of="e-gaop"}[5m])) by (app_kubernetes_io_name)
                    /
                    sum(rate(http_server_duration_count{app_kubernetes_io_part_of="e-gaop"}[1h])) by (app_kubernetes_io_name)
                  ) > 14.4
                for: 2m
                labels:
                  severity: critical
                  slo: availability
                annotations:
                  summary: "SLO burn rate critical: {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} is consuming its
                    error budget 14.4x faster than allowed. At this rate the 30-day
                    error budget will be exhausted within ~2 days.
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopSLOBurnRateHigh30m
                expr: |
                  (
                    sum(rate(http_server_duration_count{http_status_code=~"5..",app_kubernetes_io_part_of="e-gaop"}[30m])) by (app_kubernetes_io_name)
                    /
                    sum(rate(http_server_duration_count{app_kubernetes_io_part_of="e-gaop"}[6h])) by (app_kubernetes_io_name)
                  ) > 6
                for: 5m
                labels:
                  severity: critical
                  slo: availability
                annotations:
                  summary: "SLO burn rate critical (30m): {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} is consuming its
                    error budget 6x faster than allowed over a 30-minute window.
                  runbook: "docs/runbooks/high-error-rate.md"

              - alert: EgaopSLOBurnRateWarning
                expr: |
                  (
                    sum(rate(http_server_duration_count{http_status_code=~"5..",app_kubernetes_io_part_of="e-gaop"}[60m])) by (app_kubernetes_io_name)
                    /
                    sum(rate(http_server_duration_count{app_kubernetes_io_part_of="e-gaop"}[3d])) by (app_kubernetes_io_name)
                  ) > 3
                for: 15m
                labels:
                  severity: warning
                  slo: availability
                annotations:
                  summary: "SLO burn rate warning (60m): {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} is consuming its
                    error budget 3x faster than allowed over a 60-minute window.
                  runbook: "docs/runbooks/high-error-rate.md"

              - alert: EgaopAvailabilityBelowSLO
                expr: |
                  (
                    1 - (
                      sum(rate(http_server_duration_count{http_status_code=~"5..",app_kubernetes_io_part_of="e-gaop"}[5m])) by (app_kubernetes_io_name)
                      /
                      clamp_min(sum(rate(http_server_duration_count{app_kubernetes_io_part_of="e-gaop"}[5m])) by (app_kubernetes_io_name), 1)
                    )
                  ) < 0.999
                for: 5m
                labels:
                  severity: critical
                  slo: availability
                annotations:
                  summary: "Availability below 99.9%: {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} availability has
                    dropped below the 99.9% SLO target (current:
                    {{ $value | humanizePercentage }}).
                  runbook: "docs/runbooks/service-down.md"

              - alert: EgaopLatencyP95AboveSLO
                expr: |
                  histogram_quantile(0.95,
                    sum(rate(http_server_duration_bucket{app_kubernetes_io_part_of="e-gaop"}[5m])) by (le, app_kubernetes_io_name)
                  ) > 1000
                for: 5m
                labels:
                  severity: warning
                  slo: latency
                annotations:
                  summary: "p95 latency above 1s: {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} p95 latency has
                    exceeded the 1000ms SLO target (current:
                    {{ $value | printf "%.0f" }}ms).
                  runbook: "docs/runbooks/high-latency-p95.md"

              - alert: EgaopErrorBudgetExhausted
                expr: |
                  (
                    sum(increase(http_server_duration_count{http_status_code=~"5..",app_kubernetes_io_part_of="e-gaop"}[1h])) by (app_kubernetes_io_name)
                    /
                    clamp_min(sum(increase(http_server_duration_count{app_kubernetes_io_part_of="e-gaop"}[1h])) by (app_kubernetes_io_name), 1)
                  ) > 0.001
                for: 30m
                labels:
                  severity: warning
                  slo: availability
                annotations:
                  summary: "Error budget nearly exhausted: {{ $labels.app_kubernetes_io_name }}"
                  description: >-
                    Component {{ $labels.app_kubernetes_io_name }} has consumed more
                    than 0.1% of its 30-day error budget in the last hour.
                  runbook: "docs/runbooks/high-error-rate.md"
    configmapReload:
      prometheus:
        containerSecurityContext: *promContainerSC
    alertmanager:
      config:
        # E-GAOP Alertmanager configuration.
        # Live target: ConfigMap `egaop-alertmanager` (namespace egaop), key
        # `alertmanager.yml`. The Alertmanager pod has no config reloader sidecar —
        # restart the pod after applying changes:
        #   kubectl delete pod -n egaop egaop-alertmanager-0
        #
        # Receiver: replace the placeholder `url` with a real webhook (Slack incoming
        # webhook, PagerDuty Events API, Opsgenie, ...). Until then, firing alerts are
        # still fully visible in the Alertmanager UI/API (svc/egaop-alertmanager:9093)
        # and deliveries to the placeholder are simply logged as failures.
        global:
          resolve_timeout: 5m
        route:
          receiver: default-receiver
          group_by: [alertname, namespace]
          group_wait: 10s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers:
                - severity="critical"
              receiver: default-receiver
              group_wait: 30s
              repeat_interval: 4h
        receivers:
          - name: default-receiver
            webhook_configs:
              - url: https://hooks.slack.com/services/REPLACE_WITH_SLACK_WEBHOOK
                send_resolved: true
        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: [alertname, namespace]
        templates:
          - /etc/alertmanager/*.tmpl
      podSecurityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      configmapReload:
        securityContext:
          runAsUser: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
    prometheus-pushgateway:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext: *promContainerSC
    # Phase 8 — PSA restricted: node-exporter needs hostNetwork/hostPath/proc,
    # inherently incompatible with restricted (and its probes were failing
    # 21 restarts/37h on Kind). Node CPU/mem still scraped via kubelet
    # cadvisor jobs (kubernetes-nodes, kubernetes-nodes-cadvisor).
    prometheus-node-exporter:
      enabled: false
  grafana:
    enabled: true
    # W3: pin admin password to live value; chart would otherwise generate a new random one each render
    adminPassword: "zvkdfKoEQIh2FD9GQm8N0eEN7LXvp7CDQRwyN49U"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

    # W3: dashboard providers provisioned into Grafana (default + egaop folder)
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            folder: ""
            type: file
            options:
              path: /var/lib/grafana/dashboards/default
            disableDeletion: false
            editable: true
            orgId: 1
          - name: egaop
            folder: E-GAOP
            type: file
            options:
              path: /var/lib/grafana/dashboards/egaop
            disableDeletion: false
            editable: true
            orgId: 1
    # W3: datasources provisioned into Grafana (TemporalMetrics + Loki + Tempo)
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: TemporalMetrics
            uid: TemporalMetrics
            type: prometheus
            access: proxy
            url: http://egaop-prometheus-server
            isDefault: true
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://egaop-e-gaop-loki:3100
          - name: Tempo
            uid: tempo
            type: tempo
            access: proxy
            url: http://egaop-e-gaop-tempo:3200
            jsonData:
              tracesToLogs:
                datasourceUid: loki
                tags: ['job', 'instance', 'pod', 'namespace']
                mappedTags:
                  - key: service.name
                    value: service_name
                filterByTraceID: true
                filterBySpanID: true
              tracesToMetrics:
                datasourceUid: TemporalMetrics
              serviceMap:
                datasourceUid: TemporalMetrics
              nodeGraph:
                enabled: true
              lokiSearch:
                datasourceUid: loki
    # W3: mount the E-GAOP dashboards ConfigMap at the egaop provider path
    extraVolumes:
      - name: dashboards-egaop
        configMap:
          name: egaop-e-gaop-grafana-dashboards-egaop
    extraVolumeMounts:
      - name: dashboards-egaop
        mountPath: /var/lib/grafana/dashboards/egaop

opa:
  enabled: true
  replicas: 2
  hpa:
    enabled: false

otelCollector:
  enabled: false

migration:
  enabled: true

# Phase 4 — Kind-sized quotas (headroom above current ~18.5 CPU limits used)
# Phase 5: raised limits.cpu 24→32 for Loki+Promtail+Grafana headroom
# Phase 6: raised limits.cpu 32→40 for Tempo + rolling-restart headroom
resourceQuota:
  enabled: true
  requests:
    cpu: "10"
    memory: 10Gi
  limits:
    cpu: "40"
    memory: 24Gi
  pods: "100"
  services: "50"
  persistentvolumeclaims: "20"
  secrets: "80"
  configmaps: "80"
  containerDefaults:
    cpu: 500m
    memory: 512Mi
    requestCpu: 50m
    requestMemory: 64Mi
  containerMax:
    cpu: "4"
    memory: 3Gi
  containerMin:
    cpu: 10m
    memory: 16Mi
  podMax:
    cpu: "6"
    memory: 6Gi

# Phase 5 — Log aggregation (Kind-sized)
loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "3.0.0"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "3.0.0"
  resources:
    requests:
      cpu: 25m
      memory: 48Mi
    # Phase 8: 96Mi OOM-killed twice while catching up a 12h log backlog
    # after the namespace move (fresh positions file) — 128Mi headroom
    limits:
      cpu: 100m
      memory: 128Mi

# Phase 6 — Tempo distributed tracing (Kind-sized)
tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.6.1"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    # Phase 8: 384Mi OOM-killed flushing the OTLP remote_write backlog when
    # prometheus-server rolled (Recreate strategy = downtime window)
    limits:
      cpu: 300m
      memory: 512Mi

api-server:
  replicas: 2
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

workflow-engine:
  replicas: 5
  tls:
    certManager:
      enabled: true
  # Phase 7: request 128Mi → 192Mi so memory HPA (80%) no longer pegs at max
  # (steady-state usage ~125Mi = 98% of 128Mi request → 65% of 192Mi)
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      memory: 512Mi

llm-router:
  replicas: 2
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

secret-store:
  replicas: 3
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

tool-proxy:
  replicas: 3
  tls:
    certManager:
      enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 128Mi

sandbox-runtime:
  replicas: 6
  tls:
    certManager:
      enabled: true
  resources:
    requests:
