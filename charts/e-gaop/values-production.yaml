# =============================================================================
# E-GAOP Helm Values — Production Override
# =============================================================================
# Usage: helm install egaop . --values values.yaml --values values-production.yaml
# =============================================================================

global:
  environment: production

# ─── TLS / cert-manager ─────────────────────────────────────────────────────
tls:
  certManager:
    enabled: true

# ─── Service TLS (enable cert-manager for all services) ─────────────────────
api-server:
  tls:
    certManager:
      enabled: true
secret-store:
  tls:
    certManager:
      enabled: true
workflow-engine:
  tls:
    certManager:
      enabled: true
llm-router:
  tls:
    certManager:
      enabled: true
tool-proxy:
  tls:
    certManager:
      enabled: true
sandbox-runtime:
  tls:
    certManager:
      enabled: true
memory-plane:
  tls:
    certManager:
      enabled: true
observability-plane:
  tls:
    certManager:
      enabled: true
admin-console:
  tls:
    certManager:
      enabled: true

# ─── External Secrets Operator (required in production) ─────────────────────
externalSecrets:
  enabled: true
  vault:
    address: "https://vault.egaop.io:8200"  # Replace with actual Vault address
    path: "secret/data/egaop"
    kubernetesMountPath: "kubernetes"
    kubernetesRole: "egaop"
    secretsPath: "secret/data/egaop"

# ─── Redis HA (Sentinel) ────────────────────────────────────────────────────
redis:
  architecture: replication
  auth:
    existingSecret: egaop-redis-credentials
    existingSecretPasswordKey: redis-password
  sentinel:
    enabled: true
    masterSet: egaop-master
    quorum: 2
  replica:
    replicaCount: 3
    persistence:
      size: 10Gi
      enabled: true
      storageClass: fast-ssd

# ─── PostgreSQL HA ──────────────────────────────────────────────────────────
postgresql:
  auth:
    existingSecret: egaop-postgres-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      size: 50Gi
      enabled: true
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
  readReplicas:
    name: read
    replicaCount: 2
    persistence:
      size: 50Gi
      enabled: true
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi

# ─── Temporal HA ────────────────────────────────────────────────────────────
temporal:
  server:
    replicaCount: 3
    persistence:
      size: 20Gi
      enabled: true
      storageClass: fast-ssd

# ─── Service Replicas + Resources (right-sized by workload) ──────────────────
# High-traffic: api-server (3 replicas, 512Mi/1Gi), llm-router (3 replicas, 512Mi/1Gi)
# Medium-traffic: workflow-engine, secret-store, tool-proxy (2 replicas, 256Mi/512Mi)
# Low-traffic: sandbox-runtime, admin-console, observability-plane (2 replicas, 128Mi/512Mi)
# ──────────────────────────────────────────────────────────────────────────────
defaults:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# High-traffic: gateway for all REST/gRPC/WebSocket traffic
api-server:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

# High-traffic: all LLM routing, streaming, token management
llm-router:
  replicas: 3
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

# Medium-traffic: workflow orchestration
workflow-engine:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

# Medium-traffic: secret management (fast, stateless)
secret-store:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Medium-traffic: tool execution proxy
tool-proxy:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Low-traffic: sandbox lifecycle (mostly idle)
sandbox-runtime:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Low-traffic: vector store operations
memory-plane:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Low-traffic: metrics/traces processing
observability-plane:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Low-traffic: Next.js admin UI
admin-console:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sandboxIsolationLevel: "Enhanced"
llm-router:
  replicas: 2
  rateLimitRpm: 60
  anthropicBaseUrl: "https://api.anthropic.com"
  ollamaBaseUrl: "http://localhost:11434"
tool-proxy:
  replicas: 2
sandbox-runtime:
  replicas: 2
memory-plane:
  replicas: 2
observability-plane:
  replicas: 2
  prometheusRules:
    enabled: true
admin-console:
  replicas: 2

# ─── OPA (production) ──────────────────────────────────────────────────────
opa:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── OTel Collector (production) ───────────────────────────────────────────
otelCollector:
  enabled: true
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ─── Grafana (production) ──────────────────────────────────────────────────
grafana:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
    storageClass: fast-ssd
  admin:
    existingSecret: egaop-grafana-credentials
    userKey: admin-user
    passwordKey: admin-password
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: egaop
          orgId: 1
          folder: E-GAOP
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/egaop

# ─── Prometheus (production) ───────────────────────────────────────────────
prometheus:
  server:
    retention: 90d
    persistence:
      enabled: true
      size: 50Gi
      storageClass: fast-ssd
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

# ─── PodDisruptionBudget (production) ──────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── Backup (production) ──────────────────────────────────────────────────
backup:
  enabled: true
  schedule: "0 2 * * *"
  retentionDays: 30
  s3:
    enabled: true
    bucket: egaop-backups
    region: us-east-1
  persistence:
    enabled: true
    size: 20Gi
    storageClass: fast-ssd
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
