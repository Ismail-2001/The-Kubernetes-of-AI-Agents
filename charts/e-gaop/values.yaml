# =============================================================================
# E-GAOP Helm Values — Default (Development)
# =============================================================================
# ⚠️  No secrets in this file — use External Secrets Operator for all secrets
# =============================================================================

global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""
  # otel-collector service is named <release>-otel-collector (see otel-collector chart)
  otelEndpoint: "http://egaop-test-otel-collector:4317"
  # ServiceMonitors require prometheus-operator CRDs; disable for kind smoke tests
  serviceMonitorEnabled: false
  # bitnami charts now require this when images come from non-docker.io registries
  security:
    allowInsecureImages: true

# ─── TLS / cert-manager ─────────────────────────────────────────────────────
# Requires cert-manager CRDs installed in the cluster. Disabled for local kind.
tls:
  certManager:
    enabled: false

certManager:
  enabled: false
  email: platform@egaop.dev

# ─── ServiceAccount & RBAC ──────────────────────────────────────────────────
# Creates a dedicated ServiceAccount with minimal RBAC (read configmaps/secrets/pods).
serviceAccount:
  create: true

# ─── External Secrets Operator ──────────────────────────────────────────────
# Disabled by default for local kind deploys (no Vault/ESO). When disabled,
# templates/secrets.yaml renders a managed Secret directly from .Values.secrets.
externalSecrets:
  enabled: false
  vault:
    address: "http://vault:8200"
    path: "secret/data/egaop"
    kubernetesMountPath: "kubernetes"
    kubernetesRole: "egaop"
    secretsPath: "secret/data/egaop"

# ─── Vault (dev/test only — production uses managed Vault or external chart) ──
vault:
  enabled: false
  devRootTokenId: ""
  persistence:
    enabled: false
    size: 2Gi
    storageClassName: ""
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# ─── Managed secrets (used when externalSecrets.enabled=false) ──────────────
# WARNING: For development only. Production MUST use External Secrets Operator.
# Set every field to empty — deploy will fail until you provide real secrets.
secrets:
  encryptionKey: ""
  jwtSecret: ""
  databaseUrl: ""
  redisPassword: ""
  temporalTlsCert: ""
  openaiApiKey: ""

# ─── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  adminHost: admin.egaop.dev
  apiHost: api.egaop.dev
  grpcHost: grpc.egaop.dev
  certManagerIssuer: letsencrypt-prod
  certManagerEmail: admin@egaop.dev
  rateLimit: "100"

# ─── Community Charts (infrastructure) ──────────────────────────────────────
# NOTE: existingSecret must match the Secret rendered by templates/secrets.yaml
# (name = <release>-e-gaop-managed-secrets). Keys below must match that Secret.
postgresql:
  enabled: true
  auth:
    username: egaop
    password: "dev-postgres-password"
    database: egaop
    existingSecret: "egaop-test-e-gaop-managed-secrets"
    secretKeys:
      adminPasswordKey: database-url
      userPasswordKey: database-url
  primary:
    persistence:
      size: 10Gi
      enabled: true
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  metrics:
    enabled: true

redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: "dev-redis-password"
    existingSecret: "egaop-test-e-gaop-managed-secrets"
    existingPasswordKey: redis-password
  master:
    persistence:
      size: 5Gi
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  metrics:
    enabled: true

# ─── Backup (PostgreSQL daily pg_dump) ─────────────────────────────────────
backup:
  enabled: false
  schedule: "0 2 * * *"
  retentionDays: 7
  s3:
    enabled: false
    bucket: ""
    region: us-east-1
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    emptyDirSize: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

temporal:
  enabled: true
  namespace: egaop
  server:
    replicaCount: 1
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
  admintools:
    enabled: false

# ─── OPA + OTel (custom subcharts) ─────────────────────────────────────────
# NOTE: values here are merged into the subchart scope. The subcharts expect
# `image` as a {repository,tag,pullPolicy} map and `ports` as a map, so the
# parent override must match that shape (a bare string would break templates).
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "0.68.0"
    pullPolicy: IfNotPresent
  port: 8181

otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    grpc: 4317
    http: 4318
    prometheus: 8889
    health: 13133

# ─── Service Defaults ───────────────────────────────────────────────────────
defaults:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# ─── Service Overrides ──────────────────────────────────────────────────────
# tls.certManager.enabled is inherited by each subchart from global defaults.
api-server:
  enabled: true
  image: egaop/api-server
  tag: latest
  replicas: 1
  grpcPort: 50051
  healthPort: 15051
  restPort: 3001
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

secret-store:
  enabled: true
  image: egaop/secret-store
  tag: latest
  replicas: 1
  grpcPort: 50057
  healthPort: 15057
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

workflow-engine:
  enabled: true
  image: egaop/workflow-engine
  tag: latest
  replicas: 1
  healthPort: 15058
  temporalNamespace: default
  taskQueue: egaop-agent-queue
  sandboxIsolationLevel: "Enhanced"
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

llm-router:
  enabled: true
  image: egaop/llm-router
  tag: latest
  replicas: 1
  grpcPort: 50053
  healthPort: 15053
  rateLimitRpm: 30
  fallbackChain: "gpt-4o,gpt-4o-mini,gpt-3.5-turbo"
  llmTimeoutMs: "30000"
  llmMaxRetries: "3"
  llmMaxConcurrent: "25"
  # Multi-model provider support
  openaiApiKey: ""
  anthropicApiKey: ""
  anthropicBaseUrl: "https://api.anthropic.com"
  ollamaBaseUrl: "http://localhost:11434"
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

tool-proxy:
  enabled: true
  image: egaop/tool-proxy
  tag: latest
  replicas: 1
  grpcPort: 50052
  healthPort: 15052
  rateLimitRpm: 60
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

sandbox-runtime:
  enabled: true
  image: egaop/sandbox-runtime
  tag: latest
  replicas: 1
  grpcPort: 50054
  healthPort: 15054
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

memory-plane:
  enabled: true
  image: egaop/memory-plane
  tag: latest
  replicas: 1
  grpcPort: 50055
  healthPort: 15055
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

observability-plane:
  enabled: true
  image: egaop/observability-plane
  tag: latest
  replicas: 1
  grpcPort: 50056
  healthPort: 15056
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

admin-console:
  enabled: true
  image: egaop/admin-console
  tag: latest
  replicas: 1
  port: 3000
  tls:
    certManager:
      enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70
    memoryTarget: 80

# ─── Database Migration ─────────────────────────────────────────────────────
# Runs as a pre-install/pre-upgrade Helm hook Job.
# Uses postgres:16 image with psql to apply all migration SQL files in order.
migration:
  enabled: true
  image: postgres
  tag: "16"

metricsServer:
  enabled: true

# ─── Phase 5: Log Aggregation (Loki + Promtail) ─────────────────────────────
loki:
  enabled: true
  image:
    repository: grafana/loki
    tag: "3.0.0"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

promtail:
  enabled: true
  image:
    repository: grafana/promtail
    tag: "3.0.0"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ─── Phase 6: Distributed Tracing (Tempo) ───────────────────────────────────
tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.6.1"
  retention: 168h
  persistence:
    enabled: true
    size: 2Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ─── Resource Quotas (Phase 4) ──────────────────────────────────────────────
# Namespace guardrails: cap aggregate requests/limits and enforce container
# default/min/max so a single misconfigured workload cannot starve the cluster.
resourceQuota:
  enabled: true
  requests:
    cpu: "4"
    memory: 6Gi
  limits:
    cpu: "12"
    memory: 16Gi
  pods: "80"
  services: "40"
  persistentvolumeclaims: "20"
  secrets: "60"
  configmaps: "60"
  containerDefaults:
    cpu: 500m
    memory: 512Mi
    requestCpu: 50m
    requestMemory: 128Mi
  containerMax:
    cpu: "2"
    memory: 2Gi
  containerMin:
    cpu: 10m
    memory: 32Mi
  podMax:
    cpu: "4"
    memory: 4Gi


# ─── Canary / Blue-Green Deployments ────────────────────────────────────────
# Enable to deploy canary pods alongside stable. Traffic split requires Istio.
# Without Istio, canary pods run but receive no traffic until manually promoted.
canary:
  enabled: false
  istioEnabled: false
  services:
    - name: api-server
      enabled: true
      image: egaop/api-server
      tag: latest
      grpcPort: 50051
      healthPort: 15051
      weight: 10
      canaryReplicas: 1
    - name: llm-router
      enabled: true
      image: egaop/llm-router
      tag: latest
      grpcPort: 50053
      healthPort: 15053
      weight: 10
      canaryReplicas: 1
    - name: workflow-engine
      enabled: true
      image: egaop/workflow-engine
      tag: latest
      grpcPort: 50058
      healthPort: 15058
      weight: 10
      canaryReplicas: 1

# ─── Circuit Breaker ────────────────────────────────────────────────────────
# Applied to LLM Router and Tool Proxy. Prevents cascade failures when
# downstream services (OpenAI, Anthropic, sandbox runtimes) are degraded.
circuitBreaker:
  llmRouter:
    failureThreshold: 5
    recoveryTimeMs: 30000
    requestTimeoutMs: 30000
    halfOpenMaxRequests: 3
  toolProxy:
    failureThreshold: 5
    recoveryTimeMs: 15000
    requestTimeoutMs: 10000
    halfOpenMaxRequests: 2
