{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llm-router
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-router
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: e-gaop
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-router
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
{{- include "e-gaop.prometheusAnnotations" . | nindent 6 }}
      labels:
        app.kubernetes.io/name: llm-router
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: e-gaop
    spec:
{{- include "e-gaop.serviceAccountName" . | nindent 6 }}
{{- include "e-gaop.podSecurityContext" . | nindent 6 }}
      containers:
        - name: llm-router
{{- include "e-gaop.image" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.grpcPort }}
              name: grpc
              protocol: TCP
            - containerPort: {{ .Values.healthPort }}
              name: health
              protocol: TCP
{{- include "e-gaop.envFrom" . | nindent 10 }}
          env:
{{- include "e-gaop.commonEnv" (dict "serviceName" "llm-router" "healthPort" .Values.healthPort) | nindent 12 }}
            - name: SERVICE_GRPC_PORT
              value: "{{ .Values.grpcPort }}"
{{- include "e-gaop.coreSecrets" . | nindent 12 }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-llm-secrets
                  key: anthropic-api-key
                  optional: true
{{- include "e-gaop.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- include "e-gaop.containerSecurityContext" . | nindent 10 }}
{{- include "e-gaop.tlsVolumeMount" . | nindent 10 }}
{{- include "e-gaop.tlsVolume" (dict "Values" .Values "chartName" "llm-router") | nindent 6 }}
{{- end }}
