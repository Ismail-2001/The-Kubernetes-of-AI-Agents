{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: api-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: e-gaop
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: api-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-server
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: e-gaop
{{- include "e-gaop.prometheusAnnotations" . | nindent 6 }}
    spec:
{{- include "e-gaop.serviceAccountName" . | nindent 6 }}
      containers:
        - name: api-server
{{- include "e-gaop.image" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.grpcPort }}
              name: grpc
              protocol: TCP
            - containerPort: {{ .Values.restPort }}
              name: rest
              protocol: TCP
            - containerPort: {{ .Values.healthPort }}
              name: health
              protocol: TCP
{{- include "e-gaop.envFrom" . | nindent 10 }}
          env:
{{- include "e-gaop.commonEnv" (dict "serviceName" "api-server" "healthPort" .Values.healthPort) | nindent 12 }}
            - name: SERVICE_GRPC_PORT
              value: "{{ .Values.grpcPort }}"
            - name: SERVICE_REST_PORT
              value: "{{ .Values.restPort }}"
{{- include "e-gaop.coreSecrets" . | nindent 12 }}
{{- include "e-gaop.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- include "e-gaop.containerSecurityContext" . | nindent 10 }}
{{- include "e-gaop.tlsVolumeMount" . | nindent 10 }}
{{- include "e-gaop.podSecurityContext" . | nindent 6 }}
{{- include "e-gaop.tlsVolume" (dict "Values" .Values "chartName" "api-server") | nindent 6 }}
{{- end }}
