{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-tool-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tool-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: e-gaop
spec:
  replicas: {{ .Values.replicas | default 2 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: tool-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
{{- include "e-gaop.prometheusAnnotations" . | nindent 6 }}
      labels:
        app.kubernetes.io/name: tool-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: e-gaop
    spec:
{{- include "e-gaop.serviceAccountName" . | nindent 6 }}
{{- include "e-gaop.podSecurityContext" . | nindent 6 }}
      containers:
        - name: tool-proxy
{{- include "e-gaop.image" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.grpcPort }}
              name: grpc
              protocol: TCP
            - containerPort: {{ .Values.healthPort }}
              name: health
              protocol: TCP
{{- include "e-gaop.envFrom" . | nindent 10 }}
          env:
{{- include "e-gaop.commonEnv" (dict "serviceName" "tool-proxy" "healthPort" .Values.healthPort) | nindent 12 }}
            - name: SERVICE_GRPC_PORT
              value: "{{ .Values.grpcPort }}"
{{- if .Values.sandboxIpAllowlistCidrs }}
            # P1-2: caller-supplied sandbox_ip must fall inside this CIDR.
            # When unset, the proxy allows RFC1918 ranges only (and always
            # denies loopback/link-local/CGNAT regardless of config).
            - name: SANDBOX_IP_ALLOWLIST_CIDRS
              value: {{ .Values.sandboxIpAllowlistCidrs | quote }}
{{- end }}
{{- include "e-gaop.coreSecrets" . | nindent 12 }}
{{- include "e-gaop.probes" . | nindent 10 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- include "e-gaop.containerSecurityContext" . | nindent 10 }}
{{- include "e-gaop.tlsVolumeMount" . | nindent 10 }}
{{- include "e-gaop.tlsVolume" (dict "Values" .Values "chartName" "tool-proxy") | nindent 6 }}
{{- end }}
