enabled: true
image: egaop/tool-proxy
tag: latest
replicas: 2
grpcPort: 50052
healthPort: 15052
rateLimitRpm: 60
# Comma-separated CIDRs sandbox_ip requests may target (P1-2).
# Empty = RFC1918 defaults inside the proxy; set the sandbox/pod CIDR to tighten.
sandboxIpAllowlistCidrs: ""
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
serviceMonitor:
  enabled: false
tls:
  certManager:
    enabled: false
