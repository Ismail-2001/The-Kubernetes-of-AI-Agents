{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-policy-plane
  namespace: {{ .Release.Namespace }}
data:
  POLICY_PLANE_PORT: "{{ .Values.grpcPort }}"
  POLICY_PLANE_HEALTH_PORT: "{{ .Values.healthPort }}"
  OPA_URL: "http://{{ .Release.Name }}-opa:8181"
{{- end }}
