global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "egaop-services"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets:
          - "api-server:9464"
          - "memory-plane:9464"
          - "observability-plane:9464"
          - "llm-router:9464"
          - "tool-proxy:9464"
          - "secret-store:9464"
          - "sandbox-runtime:9464"
          - "workflow-engine:9464"

  - job_name: "otel-collector"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://api-server:3001/healthz
          - http://api-server:15051/healthz
          - http://llm-router:15053/healthz
          - http://tool-proxy:15052/healthz
          - http://memory-plane:15055/healthz
          - http://observability-plane:15056/healthz
          - http://secret-store:15057/healthz
          - http://workflow-engine:15058/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
