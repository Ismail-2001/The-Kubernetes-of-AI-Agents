# =============================================================================
# The Kubernetes of AI Agents — Canary Deployment Override
# =============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml \
#                  -f docker-compose.canary.yml --profile canary up -d api-server-canary
#
# The canary service runs alongside the stable api-server on offset ports:
#   Stable:  REST 3001 | gRPC 50051 | Health 15051
#   Canary:  REST 3101 | gRPC 51051 | Health 16051
#
# Both containers share the egaop-net network and connect to the same
# infrastructure (postgres, redis, etc.).
# =============================================================================

services:
  api-server-canary:
    image: ${REGISTRY:?}/${IMAGE_NAMESPACE:?}/${CANARY_IMAGE_TAG:?Set CANARY_IMAGE_TAG in .env}
    container_name: egaop-api-server-canary
    profiles:
      - canary
    ports:
      - "${CANARY_GRPC_PORT:-51051}:50051"
      - "${CANARY_REST_PORT:-3101}:3001"
      - "${CANARY_HEALTH_PORT:-16051}:15051"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TLS_ENABLED: ${TLS_ENABLED:-true}
      API_SERVER_GRPC_PORT: "50051"
      API_SERVER_HEALTH_PORT: "15051"
      API_SERVER_REST_PORT: "3001"
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      EGAOP_MASTER_ENCRYPTION_KEY: ${EGAOP_MASTER_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "6432"
      POSTGRES_USER: ${POSTGRES_USER:-egaop}
      POSTGRES_DB: ${POSTGRES_DB:-egaop}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GRAFANA_PASSWORD: ${GRAFANA_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: egaop-api-server-canary
      CANARY: "true"
      CANARY_TAG: "${CANARY_IMAGE_TAG}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:15051/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - "egaop.service=api-server"
      - "egaop.role=canary"
      - "egaop.canary.tag=${CANARY_IMAGE_TAG}"
      - "egaop.canary.started_at=${CANARY_DEPLOYED_AT:-}"
    volumes:
      - ./api/proto:/api/proto:ro
      - ./certs:/etc/egaop/certs:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - egaop-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
