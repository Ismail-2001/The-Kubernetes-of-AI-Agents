# kind-cluster-config.yml — Kind cluster for E-GAOP deployment
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # API Server
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
      # Grafana
      - containerPort: 30003
        hostPort: 30003
        protocol: TCP
      # Prometheus
      - containerPort: 30091
        hostPort: 30091
        protocol: TCP
      # Admin Console
      - containerPort: 30002
        hostPort: 30002
        protocol: TCP
  - role: worker
