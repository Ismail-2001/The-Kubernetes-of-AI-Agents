name: Deploy
run-name: "Deploy ${{ github.event.workflow_run.head_branch || github.ref_name }} — ${{ github.event.workflow_run.head_sha || github.sha }}"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  #############################################################################
  # GATE — only proceed if CI passed
  #############################################################################
  check-ci-status:
    name: Verify CI Success
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      ci_passed: ${{ steps.check.outputs.ci_passed }}
    steps:
      - name: Check CI workflow conclusion
        id: check
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$CI_CONCLUSION" = "success" ]; then
            echo "ci_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ci_passed=false" >> "$GITHUB_OUTPUT"
          fi

  #############################################################################
  # INFRA CHECK — staging server available?
  #############################################################################
  check-infra:
    name: Check Staging Infrastructure
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      has_staging_host: ${{ steps.infra.outputs.has_staging_host }}
    steps:
      - name: Check if STAGING_HOST is configured
        id: infra
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -n "$STAGING_HOST" ]; then
            echo "has_staging_host=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_staging_host=false" >> "$GITHUB_OUTPUT"
          fi

  #############################################################################
  # DEPLOY STAGING (only when infra exists)
  #############################################################################
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [check-ci-status, check-infra]
    if: needs.check-ci-status.outputs.ci_passed == 'true' && needs.check-infra.outputs.has_staging_host == 'true'
    environment: staging
    outputs:
      smoke_passed: ${{ steps.smoke.outputs.passed }}
    env:
      HAS_STAGING_HOST: ${{ secrets.STAGING_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        if: env.HAS_STAGING_HOST != ''
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add staging host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Build and push migrate image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker build \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/migrate:${{ env.IMAGE_TAG }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/migrate:latest \
            -f infrastructure/migrate/Dockerfile .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/migrate:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/migrate:latest

      - name: Sync source to staging
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='.env' \
            ./ ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}:~/egaop/

      - name: Fix permissions on staging
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "chmod +x ~/egaop/scripts/*.sh 2>/dev/null || true"

      - name: Write .env on staging
        run: |
          cat <<'ENVEOF' | ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "cat > ~/egaop/.env"
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
          LOG_LEVEL=debug
          NODE_ENV=staging
          POSTGRES_USER=egaop
          POSTGRES_DB=egaop
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EGAOP_MASTER_ENCRYPTION_KEY=${{ secrets.EGAOP_MASTER_ENCRYPTION_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          ENVEOF

      - name: Login to registry on staging
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Run database migrations on staging
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml run --rm migrate up"

      - name: Pull images on staging
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml pull --quiet"

      - name: Deploy on staging
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml up -d --wait --wait-timeout 120 --remove-orphans"

      - name: Health check poll
        run: |
          echo "Polling API health endpoint..."
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.STAGING_HOST }}:15051/healthz" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API server is healthy (attempt $i)"
              break
            fi
            echo "Waiting... (attempt $i, HTTP $status)"
            sleep 5
          done
          if [ "$status" != "200" ]; then
            echo "API server failed to become healthy"
            exit 1
          fi

      - name: Run smoke tests
        id: smoke
        run: |
          if bash scripts/smoke-test.sh "${{ secrets.STAGING_HOST }}"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag successful deploy
        if: steps.smoke.outputs.passed == 'true'
        run: |
          echo "LAST_SUCCESSFUL_DEPLOY_TAG=${{ env.IMAGE_TAG }}" >> "$GITHUB_ENV"

      - name: Update deploy tag variable
        if: steps.smoke.outputs.passed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createOrUpdateRepoVariable({
              owner, repo,
              name: 'LAST_SUCCESSFUL_DEPLOY_TAG',
              value: process.env.IMAGE_TAG,
            });

      - name: Rollback on failure
        if: steps.smoke.outputs.passed == 'false' && vars.LAST_SUCCESSFUL_DEPLOY_TAG != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          echo "Smoke tests failed. Rolling back to ${{ vars.LAST_SUCCESSFUL_DEPLOY_TAG }}..."
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} \
            "cd ~/egaop && \
             sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=${{ vars.LAST_SUCCESSFUL_DEPLOY_TAG }}/' .env && \
             docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml pull --quiet && \
             docker compose -f docker-compose.yml -f docker-compose.staging.yml -f docker-compose.deploy.yml up -d --wait --wait-timeout 120 --remove-orphans"
          bash scripts/rollback.sh "$SLACK_WEBHOOK" "${{ vars.LAST_SUCCESSFUL_DEPLOY_TAG }}"

  #############################################################################
  # DRY-RUN (no staging infra available)
  #############################################################################
  dry-run:
    name: Dry Run (no staging server)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [check-ci-status, check-infra]
    if: needs.check-ci-status.outputs.ci_passed == 'true' && needs.check-infra.outputs.has_staging_host == 'false'
    steps:
      - uses: actions/checkout@v4
      # Images are already built and validated by CI — skip redundant build
      - name: Summary
        run: |
          echo "## Deploy: Dry Run" >> $GITHUB_STEP_SUMMARY
          echo "No staging server configured (\`STAGING_HOST\` secret not set)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build status**: ✅ Images built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To enable full deployment, set the \`STAGING_HOST\` repository secret." >> $GITHUB_STEP_SUMMARY

  #############################################################################
  # PROMOTE TO PRODUCTION (manual approval, requires staging)
  #############################################################################
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [deploy-staging]
    if: needs.deploy-staging.outputs.smoke_passed == 'true'
    environment:
      name: production
      url: https://app.egaop.io
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add production host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync source to production
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='*.log' \
            --exclude='.env' \
            ./ ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }}:~/egaop/

      - name: Fix permissions on production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "chmod +x ~/egaop/scripts/*.sh 2>/dev/null || true"

      - name: Write .env on production
        run: |
          cat <<'ENVEOF' | ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "cat > ~/egaop/.env"
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          REGISTRY=${{ env.REGISTRY }}
          IMAGE_NAMESPACE=${{ env.IMAGE_NAMESPACE }}
          LOG_LEVEL=info
          NODE_ENV=production
          POSTGRES_USER=egaop
          POSTGRES_DB=egaop
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          EGAOP_MASTER_ENCRYPTION_KEY=${{ secrets.EGAOP_MASTER_ENCRYPTION_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GRAFANA_PASSWORD=${{ secrets.GRAFANA_PASSWORD }}
          INTERNAL_SERVICE_TOKEN=${{ secrets.INTERNAL_SERVICE_TOKEN }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          ENVEOF

      - name: Login to registry on production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin"

      - name: Run database migrations on production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.deploy.yml run --rm migrate up"

      - name: Pull images on production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.deploy.yml pull --quiet"

      - name: Deploy on production
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd ~/egaop && docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d --wait --wait-timeout 180 --remove-orphans"

      - name: Health check poll
        run: |
          for i in $(seq 1 18); do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://api.egaop.io/healthz" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Production API is healthy (attempt $i)"
              break
            fi
            echo "Waiting... (attempt $i, HTTP $status)"
            sleep 10
          done
          if [ "$status" != "200" ]; then
            echo "Production API failed to become healthy"
            exit 1
          fi

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh "${{ secrets.PRODUCTION_HOST }}"

      - name: Notify success
        if: success()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -s -X POST -H "Content-Type: application/json" \
              -d '{"text":"Production deploy complete: `'${{ env.IMAGE_TAG }}'`"}' \
              "$SLACK_WEBHOOK" > /dev/null 2>&1 || true
          fi
