name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fresh runners have no dist/; @e-gaop/shared publishes types via
      # dist/index.d.ts, so cross-workspace typecheck needs shared built first.
      - name: Build shared, then all workspaces
        run: |
          npm run build -w @e-gaop/shared
          npm run build --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - name: Typecheck all workspaces (gates on failure)
        run: npm run typecheck --workspaces --if-present

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Tests import @e-gaop/shared at runtime (main: dist/index.js); build first.
      - name: Build shared, then all workspaces
        run: |
          npm run build -w @e-gaop/shared
          npm run build --workspaces --if-present
      # Root script runs every workspace's test script. workflow-engine's test
      # script also runs scripts/check-no-fake-policy.ts, so fake Rego wiring
      # is a hard failure here (previously bypassed by calling jest directly).
      - name: Run all workspace tests
        run: npm run test --workspaces --if-present

  opa-test:
    name: OPA Policy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OPA (pinned v0.70.0, same as compose image)
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/v0.70.0/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version
      - name: Run rego unit tests
        run: opa test policy-plane/policies -v --v0-compatible

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.0"
      - name: Helm lint (validates values.schema.json)
        run: helm lint charts/e-gaop
      - name: Helm template with kind values
        run: helm template egaop charts/e-gaop -f charts/e-gaop/values-kind.yml > /dev/null
      - name: Helm template with staging values
        run: helm template egaop charts/e-gaop -f charts/e-gaop/values-staging.yaml > /dev/null
      - name: Helm template with production values
        run: helm template egaop charts/e-gaop -f charts/e-gaop/values-production.yaml > /dev/null

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build shared (coverage imports cross-workspace dist)
        run: npm run build -w @e-gaop/shared
      - name: Generate coverage summaries
        run: |
          cd packages/shared && npx jest --silent --coverage --coverageReporters=json-summary --coverageDirectory=coverage
          cd ../../control-plane/api-server && npx jest --silent --coverage --coverageReporters=json-summary --coverageDirectory=coverage --testTimeout=15000
      - name: Enforce coverage thresholds
        run: |
          FAILED=0
          for report in packages/shared/coverage/coverage-summary.json control-plane/api-server/coverage/coverage-summary.json; do
            if [ ! -f "$report" ]; then
              echo "::error::Coverage report not found at $report"
              FAILED=1
              continue
            fi
            STATEMENTS=$(node -e "console.log(require('./$report').total.statements.pct)")
            BRANCHES=$(node -e "console.log(require('./$report').total.branches.pct)")
            FUNCTIONS=$(node -e "console.log(require('./$report').total.functions.pct)")
            LINES=$(node -e "console.log(require('./$report').total.lines.pct)")
            echo "$report: statements=$STATEMENTS% branches=$BRANCHES% functions=$FUNCTIONS% lines=$LINES%"
            if [ "$STATEMENTS" -lt 80 ] || [ "$BRANCHES" -lt 75 ] || [ "$FUNCTIONS" -lt 80 ] || [ "$LINES" -lt 80 ]; then
              echo "::error::Coverage below threshold in $report (statements=$STATEMENTS, branches=$BRANCHES, functions=$FUNCTIONS, lines=$LINES)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more packages failed coverage thresholds"
            exit 1
          fi
          echo "All coverage thresholds met"

  openapi-lint:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint api/openapi.yaml --ruleset .spectral.yaml

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API server image
        run: docker build -t egaop-api:test -f control-plane/api-server/Dockerfile .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: egaop-api:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Run Hadolint on Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: control-plane/api-server/Dockerfile

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, openapi-lint, opa-test, helm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control-plane/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  coverage-report:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build shared (coverage imports cross-workspace dist)
        run: npm run build -w @e-gaop/shared
      - name: Generate coverage
        run: |
          cd packages/shared && npx jest --coverage --coverageReporters=json-summary --silent
          cd ../../control-plane/api-server && npx jest --coverage --coverageReporters=json-summary --silent --testTimeout=15000
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage/coverage-summary.json"
          retention-days: 7
