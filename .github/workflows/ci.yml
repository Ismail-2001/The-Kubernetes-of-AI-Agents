name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npx tsc --noEmit --project control-plane/api-server/tsconfig.json 2>/dev/null || true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run shared package tests
        run: cd packages/shared && npx jest --silent --coverage --coverageReporters=text-summary --coverageThreshold='{"global":{"statements":80,"branches":75,"functions":80,"lines":80}}'
      - name: Run API server tests
        run: cd control-plane/api-server && npx jest --silent --testTimeout=15000 --coverage --coverageReporters=text-summary --coverageThreshold='{"global":{"statements":80,"branches":75,"functions":80,"lines":80}}'
      - name: Run workflow engine tests
        run: cd control-plane/workflow-engine && npx jest --silent --testTimeout=15000

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate coverage summaries
        run: |
          cd packages/shared && npx jest --silent --coverage --coverageReporters=json-summary --coverageDirectory=coverage
          cd ../../control-plane/api-server && npx jest --silent --coverage --coverageReporters=json-summary --coverageDirectory=coverage --testTimeout=15000
      - name: Enforce coverage thresholds
        run: |
          FAILED=0
          for report in packages/shared/coverage/coverage-summary.json control-plane/api-server/coverage/coverage-summary.json; do
            if [ ! -f "$report" ]; then
              echo "::error::Coverage report not found at $report"
              FAILED=1
              continue
            fi
            STATEMENTS=$(node -e "console.log(require('./$report').total.statements.pct)")
            BRANCHES=$(node -e "console.log(require('./$report').total.branches.pct)")
            FUNCTIONS=$(node -e "console.log(require('./$report').total.functions.pct)")
            LINES=$(node -e "console.log(require('./$report').total.lines.pct)")
            echo "$report: statements=$STATEMENTS% branches=$BRANCHES% functions=$FUNCTIONS% lines=$LINES%"
            if [ "$STATEMENTS" -lt 80 ] || [ "$BRANCHES" -lt 75 ] || [ "$FUNCTIONS" -lt 80 ] || [ "$LINES" -lt 80 ]; then
              echo "::error::Coverage below threshold in $report (statements=$STATEMENTS, branches=$BRANCHES, functions=$FUNCTIONS, lines=$LINES)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more packages failed coverage thresholds"
            exit 1
          fi
          echo "All coverage thresholds met"

  openapi-lint:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install spectral
        run: npm install -g @stoplight/spectral-cli
      - name: Lint OpenAPI spec
        run: spectral lint api/openapi.yaml --ruleset .spectral.yaml 2>/dev/null || spectral lint api/openapi.yaml

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build API server image
        run: docker build -t egaop-api:test -f control-plane/api-server/Dockerfile .
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: egaop-api:test
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
        continue-on-error: true
      - name: Run Hadolint on Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: control-plane/api-server/Dockerfile
        continue-on-error: true

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, openapi-lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: control-plane/api-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  coverage-report:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate coverage
        run: |
          cd packages/shared && npx jest --coverage --coverageReporters=json-summary --silent 2>/dev/null || true
          cd ../../control-plane/api-server && npx jest --coverage --coverageReporters=json-summary --silent --testTimeout=15000 2>/dev/null || true
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: "**/coverage/coverage-summary.json"
          retention-days: 7
