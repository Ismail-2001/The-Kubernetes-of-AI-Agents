name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $TAG (expected semver X.Y.Z)"
            exit 1
          fi

      - name: Check CHANGELOG entry exists
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if ! grep -q "\[${TAG}\]" CHANGELOG.md; then
            echo "❌ No changelog entry found for v${TAG}"
            echo "   Add a [${TAG}] section to CHANGELOG.md before releasing"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          SERVICES="api-server secret-store workflow-engine llm-router tool-proxy sandbox-runtime memory-plane observability-plane"
          for svc in $SERVICES; do
            DOCKERFILE="$(find . -path "*/${svc}/Dockerfile" -print -quit)"
            if [ -z "$DOCKERFILE" ]; then
              echo "⚠️  No Dockerfile found for ${svc}, skipping"
              continue
            fi
            docker build \
              --label "org.opencontainers.image.version=${TAG}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${REGISTRY}/egaop-${svc}:${TAG}" \
              -t "${REGISTRY}/egaop-${svc}:latest" \
              -f "${DOCKERFILE}" .
            docker push "${REGISTRY}/egaop-${svc}:${TAG}"
            docker push "${REGISTRY}/egaop-${svc}:latest"
            echo "✅ Pushed ${REGISTRY}/egaop-${svc}:${TAG}"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
